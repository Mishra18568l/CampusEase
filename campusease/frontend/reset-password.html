<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - CampusEase</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    body { font-family: 'Montserrat', Arial, sans-serif; background: #e3f0ff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .box { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,33,71,0.12); max-width: 420px; width: 100%; }
    .box h2 { color: #002147; margin-bottom: 8px; }
    .box p { color: #5a6b82; margin-bottom: 24px; font-size: 0.92rem; }
    label { display: block; font-weight: 600; color: #002147; margin-bottom: 6px; font-size: 0.9rem; }
    input { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #d8e2ef; margin-bottom: 16px; font-size: 0.95rem; box-sizing: border-box; }
    button { width: 100%; padding: 13px; border-radius: 8px; border: none; background: #ff8200; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
    button:disabled { background: #d0d7e0; cursor: not-allowed; }
    .msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.88rem; display: none; }
    .msg.error { background: #fdecea; color: #e74c3c; display: block; }
    .msg.success { background: #e6f6e6; color: #1c8a3d; display: block; }
    a { color: #ff8200; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<script src="api.js"></script>

<div class="box">
    <h2><i class="fas fa-lock"></i> Reset Your Password</h2>
    <p>Choose a new password for your CampusEase account.</p>

    <div class="msg" id="msgBox"></div>

    <form id="resetForm">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="At least 6 characters" required minlength="6">

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your new password" required minlength="6">

        <button type="submit" id="submitBtn"><i class="fas fa-check"></i> Set New Password</button>
    </form>

    <p style="margin-top:18px; text-align:center;">
        <a href="index.html">Back to login</a>
    </p>
</div>

<script>
const token = new URLSearchParams(window.location.search).get('token');
const msgBox = document.getElementById('msgBox');

if (!token) {
    msgBox.className = 'msg error';
    msgBox.textContent = 'This reset link is missing its token. Please use the link from your email again.';
    document.getElementById('resetForm').style.display = 'none';
}

document.getElementById('resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
        msgBox.className = 'msg error';
        msgBox.textContent = 'Passwords do not match.';
        return;
    }

    const btn = document.getElementById('submitBtn');
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

    try {
        await apiFetch('/auth/reset-password', {
            method: 'POST',
            auth: false,
            body: { token: token, newPassword: newPassword }
        });
        msgBox.className = 'msg success';
        msgBox.textContent = 'Password updated! Redirecting you to login...';
        document.getElementById('resetForm').style.display = 'none';
        setTimeout(() => { window.location.href = 'index.html'; }, 1800);
    } catch (err) {
        msgBox.className = 'msg error';
        msgBox.textContent = err.message;
        btn.disabled = false;
        btn.innerHTML = original;
    }
});
</script>
</body>
</html>
